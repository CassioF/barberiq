# Blueprint do Render: cria o back-end FastAPI a partir deste repositório.
# No Render: New + → Blueprint → selecione o repositório. Ele pedirá os valores marcados com sync: false.
services:
  - type: web
    name: barberiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.ia.noshow
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL        # connection string do Neon/Supabase
        sync: false
      - key: CORS_ORIGINS        # URL do front no Vercel, ex.: https://barberiq.vercel.app
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: LEMBRETES_INTERVALO_MIN
        value: "15"
